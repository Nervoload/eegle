[build-system]
requires = ["setuptools==78.1.1", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eegle"
version = "0.1.0"
description = "Reproduce, record, replay, and validate synchronized neurophysiological model systems."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "John Surette"},
]
maintainers = [
  {name = "John Surette"},
]
keywords = ["eeg", "bci", "realtime", "lsl", "psychopy", "reproducibility", "neuroscience"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "jsonschema>=4.23,<5",
  "numpy>=2.0,<3",
  "packaging>=24,<27",
  "scipy>=1.14,<2",
]

[project.optional-dependencies]
runtime = [
  "pylsl>=1.18,<2",
  "psychopy>=2026.1,<2027",
  "specparam>=2.0.0rc6,<3",
]
analysis = [
  "matplotlib>=3.10,<4",
  "mne>=1.12,<2",
  "pandas>=2.3,<3",
]
ml = [
  "joblib>=1.5,<2",
  "pyriemann>=0.9,<1",
  "scikit-learn>=1.7,<2",
]
torch = [
  "onnxruntime>=1.23,<2",
  "torch>=2.9,<3",
]
deep-learning = [
  "onnxruntime>=1.23,<2",
  "torch>=2.9,<3",
]
foundation = [
  "torch>=2.9,<3",
]
docs = [
  "mkdocs>=1.6,<2",
  "mkdocstrings[python]>=0.26,<1",
]
dev = [
  "build>=1.2,<2",
  "joblib>=1.5,<2",
  "pytest>=8,<9",
  "scikit-learn>=1.7,<2",
  "twine>=5,<7",
]
all = [
  "joblib>=1.5,<2",
  "matplotlib>=3.10,<4",
  "mne>=1.12,<2",
  "onnxruntime>=1.23,<2",
  "pandas>=2.3,<3",
  "pylsl>=1.18,<2",
  "pyriemann>=0.9,<1",
  "psychopy>=2026.1,<2027",
  "scikit-learn>=1.7,<2",
  "scipy>=1.14,<2",
  "specparam>=2.0.0rc6,<3",
  "torch>=2.9,<3",
]

[project.urls]
Homepage = "https://github.com/johnsurette/closedloop"
Documentation = "https://github.com/johnsurette/closedloop/tree/main/docs"
Issues = "https://github.com/johnsurette/closedloop/issues"
Source = "https://github.com/johnsurette/closedloop"

[project.scripts]
eegle = "eegle.cli:main"
alpha8 = "eegle.pipelines.alpha8:main"
inhibition8 = "eegle.pipelines.inhibition8:main"
classify8 = "eegle.pipelines.classify8:main"
attention8 = "eegle.pipelines.attention8:main"
dsart8 = "eegle.pipelines.dsart_recording:main_dsart8"
dsart32 = "eegle.pipelines.dsart_recording:main_dsart32"

[tool.setuptools.packages.find]
include = ["configs*", "eegle*"]

[tool.setuptools.package-data]
configs = ["*.json"]
