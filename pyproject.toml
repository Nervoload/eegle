[build-system]
requires = ["setuptools==78.1.1", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "eegle"
version = "0.1.0"
description = "Reproduce, record, replay, and validate synchronized neurophysiological model systems."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "John Surette"},
]
maintainers = [
  {name = "John Surette"},
]
keywords = ["eeg", "bci", "realtime", "lsl", "psychopy", "reproducibility", "neuroscience"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "jsonschema>=4.23,<5",
  "numpy>=2.0,<3",
  "packaging>=24,<27",
  "scipy>=1.14,<2",
]

[project.optional-dependencies]
live = [
  "pylsl>=1.18,<2",
]
runtime = [
  "pylsl>=1.18,<2",
  "psychopy>=2026.1,<2027",
  "specparam>=2.0.0rc6,<3",
]
analysis = [
  "matplotlib>=3.10,<4",
  "mne>=1.12,<2",
  "pandas>=2.3,<3",
]
docs = [
  "mkdocs>=1.6,<2",
  "mkdocstrings[python]>=0.26,<1",
]
yaml = [
  "ruamel.yaml>=0.18.10,<0.19",
]
dev = [
  "build>=1.2,<2",
  "joblib>=1.5,<2",
  "pytest>=8,<9",
  "scikit-learn>=1.7,<2",
  "twine>=5,<7",
]
all = [
  "matplotlib>=3.10,<4",
  "mne>=1.12,<2",
  "pandas>=2.3,<3",
  "pylsl>=1.18,<2",
  "psychopy>=2026.1,<2027",
  "ruamel.yaml>=0.18.10,<0.19",
  "scipy>=1.14,<2",
  "specparam>=2.0.0rc6,<3",
]

[project.urls]
Homepage = "https://github.com/Nervoload/eegle"
Documentation = "https://github.com/Nervoload/eegle/tree/split/docs"
Issues = "https://github.com/Nervoload/eegle/issues"
Source = "https://github.com/Nervoload/eegle"

[project.scripts]
eegle = "eegle.__main__:main"

[project.entry-points."eegle.plugins"]
lsl = "eegle.integrations.lsl:lsl_plugin_descriptors"

[tool.setuptools.packages.find]
include = [
  "eegle",
  "eegle.actions*",
  "eegle.authoring*",
  "eegle.compiler*",
  "eegle.integrations*",
  "eegle.models*",
  "eegle.operations*",
  "eegle.plugins*",
  "eegle.processing*",
  "eegle.recording*",
  "eegle.replay*",
  "eegle.runtime*",
  "eegle.specs*",
  "eegle.streams*",
]
