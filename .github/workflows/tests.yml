name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
      - name: Compile
        run: python -m compileall -q eegle tests examples
      - name: Public import smoke
        run: python -c "import eegle; from eegle.plugins import PluginRegistry; from eegle.streams import DenseSampleBatch; print(eegle.__version__, PluginRegistry.__name__, DenseSampleBatch.__name__)"
      - name: Unit tests
        run: python -m unittest discover -s tests
