name: tests

on:
  push:
    branches: [main, pip]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    name: Python 3.10 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q eegle tests examples
      - name: Public import smoke
        run: python -c "import eegle; from eegle.models import ModelContract; from eegle.protocols import ScientificProtocol; print(eegle.__version__, ModelContract().schema, ScientificProtocol.__name__)"
      - name: Unit tests
        run: python -m unittest discover -s tests
