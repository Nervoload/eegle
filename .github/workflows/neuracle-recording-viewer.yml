name: Neuracle XDF Viewer

on:
  push:
    branches: [neuracletest]
    paths:
      - recording.xdf
      - scripts/neuracle_xdf_viewer.py
      - scripts/neuracle_xdf_viewer_template.html
      - .github/workflows/neuracle-recording-viewer.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-viewer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out recording and viewer
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Install viewer dependencies
        run: python -m pip install 'numpy>=2,<3' 'scipy>=1.14,<2' 'pyxdf>=1.17.5,<2'

      - name: Build playback HTML and QC summary
        run: python scripts/neuracle_xdf_viewer.py --input recording.xdf --output recording_view.html --summary recording_qc.json

      - name: Upload playback viewer
        uses: actions/upload-artifact@v4
        with:
          name: neuracle-recording-view
          path: |
            recording_view.html
            recording_qc.json
          retention-days: 14
